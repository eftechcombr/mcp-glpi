services:
  mcp-glpi:
    build: 
      context: . 
    image: localhost/mcp-glpi:dev
    container_name: mcp-glpi
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-stdio}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - MCP_PATH=${MCP_PATH:-/mcp}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_ALLOW_UNAUTHENTICATED=${MCP_ALLOW_UNAUTHENTICATED:-false}
      - MCP_MAX_SESSIONS=${MCP_MAX_SESSIONS:-100}
      - SESSION_TTL_MS=${SESSION_TTL_MS:-86400000}
      - GLPI_URL=${GLPI_URL}
      - GLPI_API_VERSION=${GLPI_API_VERSION:-3.0}
      - GLPI_AUTH_METHOD=${GLPI_AUTH_METHOD:-password}
      - GLPI_USERNAME=${GLPI_USERNAME}
      - GLPI_PASSWORD=${GLPI_PASSWORD}
      - GLPI_CLIENT_ID=${GLPI_CLIENT_ID}
      - GLPI_CLIENT_SECRET=${GLPI_CLIENT_SECRET}
      - GLPI_ACCESS_TOKEN=${GLPI_ACCESS_TOKEN}
      - GLPI_TIMEOUT_MS=${GLPI_TIMEOUT_MS:-15000}
      - GLPI_MAX_RETRIES=${GLPI_MAX_RETRIES:-2}
      - GLPI_ENTITY_ID=${GLPI_ENTITY_ID}
      - GLPI_PROFILE_ID=${GLPI_PROFILE_ID}
      - GLPI_ENTITY_RECURSIVE=${GLPI_ENTITY_RECURSIVE:-false}
      - GLPI_DEBUG=${GLPI_DEBUG:-false}

  mcp-glpi-smoke:
    profiles: ["smoke"]
    build:
      target: builder
    container_name: mcp-glpi-smoke
    network_mode: host
    env_file:
      - .env
    environment:
      - GLPI_URL=${GLPI_URL}
      - GLPI_API_VERSION=${GLPI_API_VERSION:-3.0}
      - GLPI_AUTH_METHOD=${GLPI_AUTH_METHOD:-password}
      - GLPI_USERNAME=${GLPI_USERNAME}
      - GLPI_PASSWORD=${GLPI_PASSWORD}
      - GLPI_CLIENT_ID=${GLPI_CLIENT_ID}
      - GLPI_CLIENT_SECRET=${GLPI_CLIENT_SECRET}
      - GLPI_ACCESS_TOKEN=${GLPI_ACCESS_TOKEN}
      - GLPI_TIMEOUT_MS=${GLPI_TIMEOUT_MS:-15000}
    command: ["bun", "run", "smoke", "--write"]
